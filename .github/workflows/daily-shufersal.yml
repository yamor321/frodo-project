# ACTIVE as of 2026-08-27: this repo is now hosted at
# github.com/yamor321/frodo-project with this file on the default branch,
# so GitHub is already scheduling it -- no further setup needed here.
# Written per the brief's warning (section 3): every day layer 1 isn't
# running is permanently lost history, since chains only retain files 3
# months.
#
# It commits its own output (data/raw + data/processed + the rendered
# site/) back to the repo using the repo-scoped GITHUB_TOKEN Actions
# provides automatically -- no human touches the daily run, and every day's
# data is a plain git commit (the audit trail requested during planning).
# For the rendered site/ to actually be *served* publicly, enable GitHub
# Pages once: repo Settings -> Pages -> Source: "Deploy from a branch" ->
# branch "master", folder "/site". No new account needed.
name: Daily Shufersal snapshot (Kfar Saba dairy pilot)

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily, after Shufersal's own nightly PriceFull publish
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily snapshot + dairy gap computation
        run: python scripts/daily_snapshot.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed site
          git diff --cached --quiet || git commit -m "Daily snapshot: $(date -u +%Y-%m-%d)"
          git push
