# ACTIVE as of 2026-08-27: this repo is hosted at
# github.com/yamor321/frodo-project with this file on the default branch,
# so GitHub is already scheduling it -- no further setup needed for the
# data-collection half. Written per the brief's warning (section 3): every
# day layer 1 isn't running is permanently lost history, since chains only
# retain files 3 months.
#
# It commits its own output (data/raw + data/processed + the rendered
# site/) back to the repo using the repo-scoped GITHUB_TOKEN Actions
# provides automatically -- no human touches the daily run, and every day's
# data is a plain git commit (the audit trail requested during planning).
#
# To actually SERVE site/ publicly: repo Settings -> Pages -> Source:
# "GitHub Actions" (NOT "Deploy from a branch" -- that classic method only
# supports "/ (root)" or "/docs", not an arbitrary folder like "/site").
# Once that one dropdown is set, this workflow's deploy step below handles
# the rest automatically on every run. Also needs the repo set to Public
# (Settings -> bottom of page -> "Change visibility") -- Pages on a
# private repo requires a paid GitHub plan; on a public repo it's free.
name: Daily price snapshot (Kfar Saba pilot -- Shufersal + Carrefour)

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily, after Shufersal's own nightly PriceFull publish
  workflow_dispatch: {}
  push:
    branches: [master]
    # Safe from an infinite loop: GitHub doesn't re-trigger workflows for
    # pushes made with the default GITHUB_TOKEN (used by the "Commit and
    # push" step below), only for pushes from a real account/PAT like this
    # one. Added so every real push deploys immediately, with no manual
    # "Run workflow" click needed.

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily snapshot + dairy gap computation
        run: python scripts/daily_snapshot.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed site
          git diff --cached --quiet || git commit -m "Daily snapshot: $(date -u +%Y-%m-%d)"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
